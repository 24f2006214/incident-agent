services:
  - type: web
    name: observable-incident-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: INCIDENT_AI_API_KEY
        sync: false
      - key: INCIDENT_AI_MODEL
        value: gpt-4o-mini

